<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pixeln HTML Playground</title>
</head>
<body style="margin: 32px; background: #1a1a2e;">
  <div id="app">
    <pixeln-canvas width="128" height="64" scale="6" gap="3" padding="4">
      <h1>Pixeln</h1>
      <p>pixel-native UI for the web</p>
      <button onclick="alert('clicked!')">Click me</button>
      <small>built with layout engine</small>
    </pixeln-canvas>
  </div>
  <script type="module">
    import { registerPixelnElement } from "@pixeln/dom";
    registerPixelnElement();
  </script>
</body>
</html>
